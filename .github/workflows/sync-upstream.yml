name: sync-upstream

# 每 30 分钟检查一次上游，有更新就把本仓库 main 同步到上游。
# 上游地址不写死：从本仓库的 fork 关系（parent）里读，换上游也不用改这个文件。
#
# ── 为什么不点网页上的「Sync fork」────────────────────────────
# 网页 Sync fork / REST 的 merge-upstream 都要人工点或额外配一个带 repo
# 权限的令牌；这里用工作流自带的 GITHUB_TOKEN 做同样的快进推送，
# 零额外密钥、零人工点击。
#
# ── 为什么默认用 GITHUB_TOKEN 而不是 PAT ──────────────────────
# GITHUB_TOKEN 发起的推送不会再触发本仓库其它工作流（GitHub 防递归的既定
# 行为），所以每次同步不会连带跑 warm-cache（macOS 预热约 15 分钟）和
# frontend-artifacts。想让同步也触发构建，就在 Settings → Secrets 里加一个
# SYNC_TOKEN（PAT，Contents: write），下面的 GH_TOKEN 会自动优先用它。
#
# ── 同步语义 = 快进优先，能快进就快进 ─────────────────────────
# 与网页 Sync fork 一致：上游领先时直接快进；fork 自己也有提交时做一次
# 合并提交；一旦合并冲突就整轮放弃、不推送任何东西，只报错交给你手动处理，
# 绝不会覆盖或丢失你 fork 上的提交。
#
# ── 平台限制（GitHub 自身行为，不是本工作流的毛病）────────────
# · cron 最小间隔 5 分钟，但 schedule 是「尽力而为」而不是承诺：本仓库实测
#   `*/10` 从注册起 11 小时只跑了 2 次（间隔 247 分钟）。因此改成 `*/30` ——
#   不指望它准时，只指望它别彻底不动；真要准点请用本机计划任务
# · 仓库 60 天无任何活动，GitHub 会自动禁用全部 schedule，需到 Actions 页重开
# · fork 仓库的 Actions 默认是关闭的，先在 Actions 页点一次
#   「I understand my workflows, go ahead and enable them」
# · 本仓库 GITHUB_TOKEN 默认权限是 read，所以下面显式声明 contents: write

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 检测上游并同步
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          repo="${GITHUB_REPOSITORY}"

          # 上游 = 本仓库的 parent（本仓库必须是 fork）
          upstream="$(gh api "repos/${repo}" --jq '.parent.full_name // .source.full_name // ""')"
          if [ -z "${upstream}" ]; then
            echo "本仓库不是 fork，没有上游，结束"
            exit 0
          fi

          # 只读对比两个 main 的 sha，没更新就不克隆，省时间
          remote_main="$(git ls-remote "https://github.com/${repo}.git" refs/heads/main | cut -f1)"
          upstream_main="$(git ls-remote "https://github.com/${upstream}.git" refs/heads/main | cut -f1)"
          echo "本仓库 main : ${remote_main}"
          echo "上游   main : ${upstream_main}  (${upstream})"
          if [ "${remote_main}" = "${upstream_main}" ]; then
            echo "已是最新，无需拉取"
            exit 0
          fi

          git clone --quiet "https://x-access-token:${GH_TOKEN}@github.com/${repo}.git" fork
          cd fork
          git fetch --quiet --no-tags "https://github.com/${upstream}.git" main
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          if ! git merge --no-edit FETCH_HEAD; then
            echo "::error::与上游 ${upstream}（${upstream_main}）合并冲突，本轮已放弃、未推送任何改动，请手动合并"
            exit 1
          fi

          git push origin main
          echo "已同步 ${remote_main} -> $(git rev-parse HEAD)"
