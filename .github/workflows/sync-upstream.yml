name: sync-upstream

# 每 30 分钟检查一次上游，有更新就把本仓库的 main / beta 同步到上游。
# 上游地址不写死：从本仓库的 fork 关系（parent）里读，换上游也不用改这个文件。
#
# ── 跟哪几条分支 ─────────────────────────────────────────────
# `main` 与 `beta`（见脚本里的 `branches`）。上游新增分支时改那一行即可；
# fork 里**还没有**的分支会在第一次同步时按上游原样建出来（不并、不挑）。
#
# ── 为什么不点网页上的「Sync fork」────────────────────────────
# 网页 Sync fork / REST 的 merge-upstream 都要人工点或额外配一个带 repo
# 权限的令牌；这里用工作流自带的 GITHUB_TOKEN 做同样的快进推送，
# 零额外密钥、零人工点击。
#
# ── 为什么默认用 GITHUB_TOKEN 而不是 PAT ──────────────────────
# GITHUB_TOKEN 发起的推送不会再触发本仓库其它工作流（GitHub 防递归的既定
# 行为），所以每次同步不会连带跑 warm-cache（macOS 预热约 15 分钟）和
# frontend-artifacts。想让同步也触发构建，就在 Settings → Secrets 里加一个
# SYNC_TOKEN（PAT，Contents: write），下面的 GH_TOKEN 会自动优先用它。
#
# ── 同步语义 = 快进优先，能快进就快进 ─────────────────────────
# 与网页 Sync fork 一致：上游领先时直接快进；fork 自己也有提交时做一次
# 合并提交；一旦合并冲突就整轮放弃、不推送任何东西，只报错交给你手动处理，
# 绝不会覆盖或丢失你 fork 上的提交。
#
# ── 平台限制（GitHub 自身行为，不是本工作流的毛病）────────────
# · cron 最小间隔 5 分钟，但 schedule 是「尽力而为」而不是承诺：本仓库实测
#   `*/10` 从注册起 11 小时只跑了 2 次（间隔 247 分钟）。因此改成 `*/30` ——
#   不指望它准时，只指望它别彻底不动；真要准点请用本机计划任务
# · 仓库 60 天无任何活动，GitHub 会自动禁用全部 schedule，需到 Actions 页重开
# · fork 仓库的 Actions 默认是关闭的，先在 Actions 页点一次
#   「I understand my workflows, go ahead and enable them」
# · 本仓库 GITHUB_TOKEN 默认权限是 read，所以下面显式声明 contents: write

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 检测上游并同步
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          repo="${GITHUB_REPOSITORY}"
          # 跟这几条分支（空格分隔）。加分支就改这一行。
          branches="main beta"

          # 上游 = 本仓库的 parent（本仓库必须是 fork）
          upstream="$(gh api "repos/${repo}" --jq '.parent.full_name // .source.full_name // ""')"
          if [ -z "${upstream}" ]; then
            echo "本仓库不是 fork，没有上游，结束"
            exit 0
          fi

          fork_url="https://github.com/${repo}.git"
          upstream_url="https://github.com/${upstream}.git"

          # 先只读比对（不克隆）：每条分支的上游 sha 与 fork sha 相同就当作齐平。
          # 注意 fork 上通常有本工作流自己的提交，sha **永远**与上游不同 —— 所以
          # 「齐平」只在 fork 没本地提交的分支上成立；不成立时会多克隆一次，
          # 但下面的 merge 是「已是最新」，不会产生多余提交。
          need=0
          for branch in ${branches}; do
            fork_sha="$(git ls-remote "${fork_url}" "refs/heads/${branch}" | cut -f1)"
            up_sha="$(git ls-remote "${upstream_url}" "refs/heads/${branch}" | cut -f1)"
            echo "本仓库 ${branch} : ${fork_sha:-（不存在）}"
            echo "上游   ${branch} : ${up_sha:-（不存在）}  (${upstream})"
            if [ -n "${up_sha}" ] && [ "${fork_sha}" != "${up_sha}" ]; then
              need=1
            fi
          done
          if [ "${need}" = "0" ]; then
            echo "已是最新，无需拉取"
            exit 0
          fi

          git clone --quiet "https://x-access-token:${GH_TOKEN}@github.com/${repo}.git" fork
          cd fork
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          # 逐分支同步；某条失败不拖累另一条，但整轮会以非零退出
          fail=0
          for branch in ${branches}; do
            echo "── ${branch} ──────────────────────────────"
            fork_sha="$(git ls-remote origin "refs/heads/${branch}" | cut -f1)"
            up_sha="$(git ls-remote "${upstream_url}" "refs/heads/${branch}" | cut -f1)"
            if [ -z "${up_sha}" ]; then
              echo "上游没有 ${branch}，跳过"
              continue
            fi
            if [ "${fork_sha}" = "${up_sha}" ]; then
              echo "已是最新"
              continue
            fi

            git fetch --quiet --no-tags "${upstream_url}" "${branch}"
            fetched="$(git rev-parse FETCH_HEAD)"

            # fork 还没有这条分支：按上游原样建出来（不合并，直接指向上游那次提交）
            if [ -z "${fork_sha}" ]; then
              git push origin "FETCH_HEAD:refs/heads/${branch}"
              echo "已创建 ${branch} -> ${fetched}"
              continue
            fi

            git checkout --quiet -B "${branch}" "origin/${branch}"
            if ! git merge --no-edit FETCH_HEAD; then
              echo "::error::${branch} 与上游（${fetched}）合并冲突，该分支本轮已放弃、未推送，请手动合并"
              git merge --abort >/dev/null 2>&1 || true
              fail=1
              continue
            fi

            git push origin "${branch}"
            echo "已同步 ${branch}：${fork_sha} -> $(git rev-parse HEAD)"
          done
          exit "${fail}"
