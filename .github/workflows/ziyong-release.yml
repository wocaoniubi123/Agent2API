name: ziyong-release

# 自用发行版：在**本仓库（fork）**里编一条 Windows 安装包，挂成本仓库的 pre-release。
#
# ── 为什么不走官方那条链 ────────────────────────────────────
# 官方发布链（`Agent2Builder/agent2api-releases` 的 `release.yml`）把
# `SOURCE_REPO` 写死成 `aimod-cc/Agent2API`，永远 checkout **上游仓库**的 tag；
# 本 fork 的分支进不了那个构建。所以自用发行版只能在自己的 Actions 里编。
# 与官方链路互不影响：tag 与 Release 都只落在本仓库。
#
# ── 为什么产物未签名 ────────────────────────────────────────
# 仓库里没有任何 Windows 代码签名材料（Apple / Android / iOS 的都在构建仓库，
# 且 Windows 本来就只出未签名包）。首次运行会有 SmartScreen 提示，
# 选「更多信息 → 仍要运行」即可。
#
# ── 为什么 tag 要显式 --target ──────────────────────────────
# `gh release create <tag>` 不给 `--target` 时，tag 会打在**默认分支 HEAD** 上，
# 而这里要的是「这次 workflow_dispatch 选的那次提交」（通常是 ziyong）。
#
# ── 触发 ────────────────────────────────────────────────────
# 只有 workflow_dispatch（手动）：这是自用包，不做定时、不跟 push，
# 免得每推一次分支就白烧十几分钟 Windows 机器。

on:
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的 tag（已存在则只覆盖上传安装包）'
        required: false
        default: 'ziyong-20261105.2'

permissions:
  contents: write

concurrency:
  group: ziyong-release
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      # 版本、任务名与官方 build.yml 保持一致，缓存 key 才对得上
      - name: 安装 Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop-tauri/package-lock.json

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 Rust 依赖
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop-tauri/src-tauri -> ../../target

      - name: 安装桌面端依赖
        run: npm --prefix desktop-tauri ci

      - name: 构建 Windows 安装包（NSIS）
        run: npm --prefix desktop-tauri run build

      # 先留一份 artifact：即使后面的 Release 步骤因为权限/重名失败，
      # 产物也不会白编一趟
      - name: 上传产物（artifact 兜底）
        uses: actions/upload-artifact@v7
        with:
          name: ziyong-nsis
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: 发布到本仓库 Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          # 正文放在 env 里而不是 heredoc：YAML 块标量会给每行加缩进，
          # heredoc 的结束符必须顶格，缩进后会一直读到文件尾（仓库里踩过）
          NOTES: |
            自用构建，基于 `ziyong` 分支：上游 **3.5.0-beta.1**（`aba58858`）+ 本分支改动。
            Windows x64 安装包（NSIS），**未签名**，首次运行需在 SmartScreen 里选「仍要运行」。

            ### 本分支改动

            - 账号页：「邀请码」弹窗（按平台分组，可填码 / 查码 / 兑换码）+「今日积分」汇总面板
            - 账号页：移除失效的「查询余额并发」输入框（上游改成任务队列后已不生效），接口与配置键一并删除
            - 签到中心：成长任务补「全部查询」（只查不执行）；新手福利 / 成长任务按「未完成 → 已完成」排序
            - 请求日志：新增「命中率」列，内容区拉满宽度
            - 提示条停留时间改为 1 秒
            - 批量修改的日志级别改按结果给（不再因摘要里的「失败重试」字样被误判成 error）
            - 所有产物跟随安装目录（含 WebView2 缓存）；脚本插件卸载后清理磁盘目录
            - 凭证每日全量强刷（22:00 后第一趟刷全部账号）+ 维护设置里的「立即强刷」

            ### 上游 3.5.0-beta.1 的变化（aba58858）

            新增：独立 WASM 插件支持、Magpie / OpenCode 插件目录、QuWork 账号接入、
            客户端接入多配置管理、图片兼容设置、临期凭证与模型目录自动维护、
            面板名称与 Logo 自定义、登录人机验证、原生协议直通；
            优化：统计报表与请求回放、签到中心活动与套餐展示、内存与数据库开销、云同步、插件更新；
            移除：**电脑端 Codex 对话及官方终端共享**（上游本次 beta 暂不包含，普通模型对话不受影响）。

            ### 兼容性

            - 插件协议：仍指向本 fork 的 `ziyong-3.4.4` tag（含 `invite_code` 能力位），`PROTOCOL_VERSION = 1` 与官方一致
            - `db/**` 本轮零改动；schema 仍是 29（上一版已完成 27 → 29 迁移）
            - 版本号：3.4.2 → 3.5.0-beta.1
        run: |
          set -euo pipefail
          printf '%s' "$NOTES" > notes.md
          ls -l target/release/bundle/nsis/
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG 已存在 → 只覆盖上传安装包"
            gh release upload "$TAG" target/release/bundle/nsis/*.exe --clobber
          else
            gh release create "$TAG" target/release/bundle/nsis/*.exe \
              --target "$GITHUB_SHA" \
              --title 'ziyong 自用构建 · 3.5.0-beta.1 · 2026-11-10' \
              --notes-file notes.md \
              --prerelease
          fi
          gh release view "$TAG" --json url,assets --jq '"Release: " + .url + "  资产: " + ([.assets[].name] | join(", "))'
